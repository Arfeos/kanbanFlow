<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KanbanFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

  </head>
  <body>
    <header>
      <section>
        <img src="src/img/logo.png" alt="Logo de KanbanFlow" />
        <h1>KanbanFlow</h1>
      </section>
      <section>
        <div class="stats">
          <span class="stat">
            <span class="dot purple"></span>
            28 tareas
          </span>

          <span class="separator">•</span>

          <span class="stat">
            <span class="dot blue"></span>
            6 en progreso
          </span>
        </div>
        <button class="add-button">
          <span class="material-symbols-outlined"> add </span> Nueva Tarea
        </button>
      </section>
    </header>
    <main>
      <section class="survey">
        <section class="survey-card">
          <div class="survey-data">
            <div>Total tareas</div>
            <div class="survey-number" id="total-number">5</div>
          </div>
          <div class="survey-icon">
            <span class="material-symbols-outlined"> assignment </span>
          </div>
        </section>
        <section class="survey-card">
          <div class="survey-data">
            <div>por hacer</div>
            <div class="survey-number" id="todo-number">2</div>
          </div>
          <div class="survey-icon">
            <span class="material-symbols-outlined"> construction </span>
          </div>
        </section>
        <section class="survey-card">
          <div class="survey-data">
            <div>En proceso</div>
            <div class="survey-number" id="inProgress-number">2</div>
          </div>
          <div class="survey-icon">
            <span class="material-symbols-outlined"> hourglass_bottom</span>
          </div>
        </section>
        <section class="survey-card">
          <div class="survey-data">
            <div>Finalizado</div>
            <div class="survey-number" id="done-number">1</div>
          </div>
          <div class="survey-icon">
            <span class="material-symbols-outlined"> check_circle </span>
          </div>
        </section>
      </section>
      <section class="filters">
        <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" placeholder="Filtrar por título o contenido..." />
        </div>
        <div class="priority-filter">
          <span class="priority-label">Prioridad:</span>

          <button class="priority active">Todas</button>

          <button class="priority high active">
            <span class="dot"></span>
            Alta
          </button>

          <button class="priority medium">
            <span class="dot"></span>
            Media
          </button>

          <button class="priority low">
            <span class="dot"></span>
            Baja
          </button>
        </div>
      </section>
      <section class="table-container">

      </section>
    </main>
<script type="importmap">
{
  "imports": {
    "axios": "https://cdn.jsdelivr.net/npm/axios@1.20.0/+esm",
    "sortablejs": "https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/+esm"
  }
}
</script>

<script type="module" src="src/js/main.js"></script>
  </body>
</html>
